<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>50 mock cars · Card library</title><link rel="stylesheet" href="./ui/theme.css"><link rel="stylesheet" href="./ui/compatibility.css"><link rel="stylesheet" href="./ui/tokens.css"><link rel="stylesheet" href="./ui/icons.css"><link rel="stylesheet" href="./ui/vehicle-cards.css"><link rel="stylesheet" href="./car-cards-preview.css"><style>.filters{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}.filters label{display:grid;gap:4px;font-size:12px;color:var(--secondary)}input,select,.load-more{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.mock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:32px;align-items:start}.mock-grid-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,336px),1fr))}.mock-grid-desktop-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,302px),1fr))}.mock-grid-carousel-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}figure{min-width:0}details{margin-top:12px;font-size:12px;max-width:100%}summary{cursor:pointer;color:var(--secondary)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border:1px solid var(--line);border-radius:8px;max-height:400px;overflow:auto}.load-more{margin:32px 0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:3px}</style></head><body><div id="mock-root"></div><script type="module" src="./ui/mock-car-cards-preview.js"></script></body></html>
